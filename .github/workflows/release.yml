name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ottyp
            asset_name: ottyp-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ottyp
            asset_name: ottyp-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ottyp
            asset_name: ottyp-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ottyp.exe
            asset_name: ottyp-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release_package
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release_package/
          cp README.md release_package/
          cd release_package
          tar -czvf ../${{ matrix.asset_name }}.tar.gz *

      - name: Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir release_package
          copy target\${{ matrix.target }}\release\${{ matrix.artifact_name }} release_package\
          copy README.md release_package\
          Compress-Archive -Path release_package\* -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
